[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amxtriage"
dynamic = ["version"]
description = "Cross-platform SA-MP/open.mp log triage with a CLI and optional desktop GUI for AMX runtime errors, crashes, compiler diagnostics, and admin alerts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "amxtriage contributors" }]
keywords = ["samp", "open.mp", "pawn", "amx", "crashdetect", "logs", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
amxtriage = "amxtriage.cli:main"

[tool.hatch.version]
path = "src/amxtriage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amxtriage"]

[tool.hatch.build.targets.wheel.force-include]
"src/amxtriage/locales.json" = "amxtriage/locales.json"
"src/amxtriage/plugin_catalog.json" = "amxtriage/plugin_catalog.json"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "scripts",
    "integrations",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CHANGELOG.id.md",
    "CHANGELOG.es.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "HANDOFF.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["amxtriage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "S", "A", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108", "S311", "S603", "S607"]
"scripts/**" = ["S311", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "conftest",
    "helpers",
    "test_aggregate",
    "test_alerts",
    "test_analysis",
    "test_baseline",
    "test_cli",
    "test_compiler",
    "test_follow",
    "test_fixes",
    "test_gui",
    "test_fuzz",
    "test_hardening",
    "test_parser",
    "test_reader",
    "test_recommendation",
    "test_render",
    "test_monitoring",
    "test_security",
    "test_source",
    "test_staging_bridge_probe",
    "test_textutil",
    "test_watch",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
