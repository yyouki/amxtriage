name: Release artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and validate distributable artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate version tag matches package metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" || ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select a semantic version tag such as v0.1.0."
            exit 1
          fi
          TAG_VERSION="${REF_NAME#v}"
          PACKAGE_VERSION="$(python -c 'import ast; from pathlib import Path; t=ast.parse(Path("src/amxtriage/__init__.py").read_text(encoding="utf-8")); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in n.targets)))')"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/amxtriage" --help
          "$RUNNER_TEMP/release-smoke/bin/amxtriage" gui --help
          "$RUNNER_TEMP/release-smoke/bin/amxtriage" analyze examples/sample_server_log.txt --format json > "$RUNNER_TEMP/release-report.json"
          "$RUNNER_TEMP/release-smoke/bin/python" -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); assert r.get("schema_version") and r.get("summary")' "$RUNNER_TEMP/release-report.json"
          "$RUNNER_TEMP/release-smoke/bin/amxtriage" catalog --format json > "$RUNNER_TEMP/release-catalog.json"
          "$RUNNER_TEMP/release-smoke/bin/python" -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); assert r["schema_version"] == 1 and r["entry_count"] == len(r["entries"])' "$RUNNER_TEMP/release-catalog.json"
      - name: Generate artifact checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Create a draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
