name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  quality:
    name: Static checks and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and package tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build twine
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy strict
        run: python -m mypy
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify CLI entry point
        run: |
          python -m venv "$RUNNER_TEMP/amxtriage-smoke"
          "$RUNNER_TEMP/amxtriage-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/amxtriage-smoke/bin/amxtriage" --help
          "$RUNNER_TEMP/amxtriage-smoke/bin/amxtriage" gui --help
          "$RUNNER_TEMP/amxtriage-smoke/bin/amxtriage" catalog --format json > "$RUNNER_TEMP/plugin-catalog.json"
          "$RUNNER_TEMP/amxtriage-smoke/bin/python" -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); assert p["schema_version"] == 1 and p["entry_count"] == len(p["entries"])' "$RUNNER_TEMP/plugin-catalog.json"
      - name: Smoke-test local watch resource benchmark
        run: python scripts/benchmark_watch.py --events 3 --timeout 15

  pawn-bridge:
    name: Compile Pawn bridge and validate patch workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install amxtriage for real compiler patch smoke test
        run: python -m pip install .
      - name: Download pinned Pawn compiler
        env:
          PAWN_COMPILER_VERSION: "v3.10.10"
          SAMP_STDLIB_REVISION: "8ffb055624308b25521665b60e78b5e6e6b3717f"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pawn-compiler" "$RUNNER_TEMP/pawn-compiler-source" "$RUNNER_TEMP/samp-stdlib"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pawn-lang/compiler/releases/download/${PAWN_COMPILER_VERSION}/pawnc-3.10.10-linux.tar.gz" \
            --output "$RUNNER_TEMP/pawn-compiler.tar.gz"
          tar -xzf "$RUNNER_TEMP/pawn-compiler.tar.gz" -C "$RUNNER_TEMP/pawn-compiler"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pawn-lang/compiler/archive/refs/tags/${PAWN_COMPILER_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/pawn-compiler-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/pawn-compiler-source.tar.gz" -C "$RUNNER_TEMP/pawn-compiler-source"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/pawn-lang/samp-stdlib/archive/${SAMP_STDLIB_REVISION}.tar.gz" \
            --output "$RUNNER_TEMP/samp-stdlib.tar.gz"
          tar -xzf "$RUNNER_TEMP/samp-stdlib.tar.gz" -C "$RUNNER_TEMP/samp-stdlib"
          PAWNCC="$(find "$RUNNER_TEMP/pawn-compiler" -type f -name pawncc -print -quit)"
          PAWN_LIB="$(find "$RUNNER_TEMP/pawn-compiler" -type f -name libpawnc.so -print -quit)"
          CORE_INCLUDE="$(find "$RUNNER_TEMP/pawn-compiler-source" -type f -name core.inc -print -quit)"
          SAMP_INCLUDE="$(find "$RUNNER_TEMP/samp-stdlib" -type f -name a_samp.inc -print -quit)"
          test -n "$PAWNCC"
          test -n "$PAWN_LIB"
          test -n "$CORE_INCLUDE"
          test -n "$SAMP_INCLUDE"
          chmod +x "$PAWNCC"
          export LD_LIBRARY_PATH="$(dirname "$PAWN_LIB"):${LD_LIBRARY_PATH:-}"
          printf 'SA-MP Pawn compiler: %s\n' "$PAWNCC"
          INCLUDE_ARGS=("-i$(dirname "$SAMP_INCLUDE")" "-i$(dirname "$CORE_INCLUDE")")
          "$PAWNCC" \
            "${INCLUDE_ARGS[@]}" \
            "-o$RUNNER_TEMP/amxtriage_bridge_samp.amx" \
            "$GITHUB_WORKSPACE/integrations/pawn/amxtriage_bridge.pwn"
          test -s "$RUNNER_TEMP/amxtriage_bridge_samp.amx"
          python scripts/validate_patch_with_pawn_compiler.py "$PAWNCC"
      - name: Download official open.mp Pawn compiler and includes
        env:
          OPENMP_COMPILER_VERSION: "v3.10.11"
          OMP_STDLIB_REVISION: "17c1b0191195cb0b59a820135fbca622c84129dd"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openmp-compiler" "$RUNNER_TEMP/openmp-compiler-source" "$RUNNER_TEMP/omp-stdlib"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/openmultiplayer/compiler/releases/download/${OPENMP_COMPILER_VERSION}/pawnc-3.10.11-linux.tar.gz" \
            --output "$RUNNER_TEMP/openmp-compiler.tar.gz"
          tar -xzf "$RUNNER_TEMP/openmp-compiler.tar.gz" -C "$RUNNER_TEMP/openmp-compiler"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/openmultiplayer/compiler/archive/refs/tags/${OPENMP_COMPILER_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/openmp-compiler-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/openmp-compiler-source.tar.gz" -C "$RUNNER_TEMP/openmp-compiler-source"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/openmultiplayer/omp-stdlib/archive/${OMP_STDLIB_REVISION}.tar.gz" \
            --output "$RUNNER_TEMP/omp-stdlib.tar.gz"
          tar -xzf "$RUNNER_TEMP/omp-stdlib.tar.gz" -C "$RUNNER_TEMP/omp-stdlib"
          OMP_PAWNCC="$(find "$RUNNER_TEMP/openmp-compiler" -type f -name pawncc -print -quit)"
          OMP_PAWN_LIB="$(find "$RUNNER_TEMP/openmp-compiler" -type f -name libpawnc.so -print -quit)"
          OMP_CORE_INCLUDE="$(find "$RUNNER_TEMP/openmp-compiler-source" -type f -name core.inc -print -quit)"
          OMP_INCLUDE="$(find "$RUNNER_TEMP/omp-stdlib" -type f -name open.mp.inc -print -quit)"
          test -n "$OMP_PAWNCC"
          test -n "$OMP_PAWN_LIB"
          test -n "$OMP_CORE_INCLUDE"
          test -n "$OMP_INCLUDE"
          chmod +x "$OMP_PAWNCC"
          export LD_LIBRARY_PATH="$(dirname "$OMP_PAWN_LIB"):${LD_LIBRARY_PATH:-}"
          printf 'open.mp Pawn compiler: %s\n' "$OMP_PAWNCC"
          OMP_INCLUDE_ARGS=("-i$(dirname "$OMP_INCLUDE")" "-i$(dirname "$OMP_CORE_INCLUDE")")
          "$OMP_PAWNCC" \
            "${OMP_INCLUDE_ARGS[@]}" \
            "-o$RUNNER_TEMP/amxtriage_bridge_openmp.amx" \
            "$GITHUB_WORKSPACE/integrations/pawn/amxtriage_bridge_openmp.pwn"
          test -s "$RUNNER_TEMP/amxtriage_bridge_openmp.amx"
      - name: Upload compiled bridge artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amxtriage-pawn-bridges
          path: |
            ${{ runner.temp }}/amxtriage_bridge_samp.amx
            ${{ runner.temp }}/amxtriage_bridge_openmp.amx
          if-no-files-found: error
          retention-days: 7
