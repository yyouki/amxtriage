name: Feature request
description: Suggest a user-facing improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Prefer specific problems and acceptance criteria over a broad request to support everything. Do not include private server data or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      placeholder: Describe the task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      placeholder: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Optional alternatives or workarounds.
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - CLI
        - Desktop GUI
        - Log/compiler diagnostics
        - SA-MP Pawn bridge
        - open.mp Pawn bridge
        - Documentation/localization
        - Packaging/CI
        - Other
    validations:
      required: true
